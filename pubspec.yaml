name: ads_manager
description: Reusable AdMob manager for Flutter with placements, ad rules, cooldown, premium and temporary ad disabling.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
